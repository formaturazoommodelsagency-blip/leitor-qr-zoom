<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor QR | Zoom</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f7;margin:0;padding:20px;color:#162d4f}
main{background:white;max-width:430px;margin:20px auto;padding:22px;border-radius:16px;text-align:center}
h1{font-size:24px}
button{width:100%;padding:15px;margin:10px 0;background:#162d4f;color:white;border:0;border-radius:8px;font-size:16px}
button:disabled{opacity:.5}
#reader{width:100%;margin:15px 0}
#status{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>ZOOM AGÊNCIA DE MODELOS</h1>
<p>Leitor de QR Code — Formatura 2026</p>
<button id="startBtn" onclick="start()">ABRIR CÂMERA</button>
<div id="reader"></div>
<p id="status" role="status">Pronto para ler o convite.</p>
</main>
<script>
const CHECKIN_URL='https://script.google.com/macros/s/AKfycbxXQzczYE_oKJhZvaD8Z0WRvhkTKAaPdPf3DVWLMDkOIsjQJYLvQFcI580oOQD8_jWZ/exec';
let scanner=null;
let processing=false;
async function start(){
 const status=document.getElementById('status');
 const button=document.getElementById('startBtn');
 if(processing)return;
 try{
  if(scanner){
   try{if(scanner.isScanning)await scanner.stop();}catch(e){}
   try{scanner.clear();}catch(e){}
  }
  scanner=new Html5Qrcode('reader');
  status.textContent='Aponte a câmera para o QR Code.';
  await scanner.start(
   {facingMode:'environment'},
   {fps:10,qrbox:220},
   async decoded=>{
    if(processing)return;
    const code=String(decoded||'').trim().toUpperCase();
    if(!/^ZOOM26-[A-Z0-9]+$/.test(code)){
     status.textContent='Este QR Code não é um convite Zoom válido.';
     return;
    }
    processing=true;
    button.disabled=true;
    status.textContent='Código reconhecido. Abrindo check-in...';
    try{if(scanner.isScanning)await scanner.stop();}catch(e){}
    window.location.assign(CHECKIN_URL+'?code='+encodeURIComponent(code));
   },
   ()=>{}
  );
 }catch(e){
  status.textContent='Não foi possível abrir a câmera: '+(e.message||e);
  button.disabled=false;
 }
}
</script>
</body>
</html>
